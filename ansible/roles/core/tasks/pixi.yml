# Parametrized task: expects a `pixi_tools` list. Other roles reuse it with
# `include_role: {name: core, tasks_from: pixi}` — core being the only
# allowed cross-role dependency, this is not a "utils" role in disguise.
#
# The play runs with become: true, but pixi is strictly user-space:
# hence become: false, and HOME resolved via lookup (ansible_env.HOME
# would be /root since facts are gathered with become).
- name: Install pixi global tools
  ansible.builtin.command:
    cmd: "{{ lookup('env', 'HOME') }}/.pixi/bin/pixi global install {{ item }}"
    creates: "{{ lookup('env', 'HOME') }}/.pixi/envs/{{ item.split('=') | first }}"
  loop: "{{ pixi_tools }}"
  become: false
