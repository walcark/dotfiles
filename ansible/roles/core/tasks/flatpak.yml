- name: Ensure flatpak is available
  ansible.builtin.command: flatpak --version
  register: r_flatpak_check
  changed_when: false

- name: Add FlatHub remote (user)
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
    method: user
    state: present
