# Inverse of gnome/tasks/main.yml, reverse order — see meta/layer.yml for
# the full task list. The shell-version/extension-info lookup is repeated
# from main.yml: it's needed again here to recover each extension's uuid,
# not a persistent install of its own.
- name: Get Gnome shell version.
  ansible.builtin.shell: |
    set -o pipefail
    gnome-shell --version | sed 's/[^0-9.]*\([0-9.]*\).*/\1/'
  register: gnome_shell_version
  changed_when: false

- name: Get Gnome Shell extension info
  ansible.builtin.uri:
    url: "https://extensions.gnome.org/extension-info/?pk={{ item }}&shell_version={{ gnome_shell_version.stdout }}"
    return_content: yes
  loop: "{{ gnome_extension_ids }}"
  register: r_gnome_extension_info

- name: Uninstall extensions
  include_tasks: absent_install_extension.yml
  vars:
    gnome_extension_info: "{{ item.json }}"
  loop: "{{ r_gnome_extension_info.results }}"

- import_tasks: absent_thunderbird.yml
