# Pixi tools for development machines (layers.dev).
# Editor-agnostic tooling only: the language stack required by the Neovim
# config is declared in the nvim repo itself (mini-nvim/tools.yaml) and
# installed by tasks/nvim.yml right after the clone.
dependencies:
  - core

dev_pixi_tools:
  - nvim
  - lazygit
  - go
  - python=3.11
  - typst
  - tinymist
  - plantuml

nvim_config_repo: "git@github.com:walcark/nvim-configs.git"
