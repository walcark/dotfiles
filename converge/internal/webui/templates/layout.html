{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Converge · {{.Title}}</title>
<link rel="stylesheet" href="/static/nocturne.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span></span></div>
      <div class="brand-label">Converge</div>
    </div>

    <nav class="nav">
      {{range .Nav}}
        {{if .Enabled}}
          <a class="nav-item{{if .Active}} active{{end}}" href="{{.Href}}">
            <i class="ph ph-{{.Icon}}"></i><span class="label">{{.Label}}</span>
          </a>
        {{else}}
          <span class="nav-item disabled">
            <i class="ph ph-{{.Icon}}"></i><span class="label">{{.Label}}</span>
            <span class="tag tag-neutral">{{.Badge}}</span>
          </span>
        {{end}}
      {{end}}
    </nav>

    <div class="sidebar-bottom">
      <div class="machine-card">
        <div class="kicker">Machine</div>
        <div class="host"><i class="ph ph-laptop"></i>{{.Machine.Hostname}}</div>
        <div class="tags">
          {{range .Machine.Tags}}<span class="tag tag-neutral">{{.}}</span>{{end}}
        </div>
      </div>
      <a href="/run" class="btn btn-primary btn-block" style="justify-content:center">
        <i class="ph ph-play-circle"></i><span>Converge</span>
      </a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="flex:1;min-width:0">
        <div class="kicker">{{.Kicker}}</div>
        <h2>{{.Title}}</h2>
      </div>
      <div class="topbar-right">
        <div class="branch"><i class="ph ph-git-branch"></i>{{.Machine.Branch}}</div>
        <button class="btn btn-secondary" disabled title="Runs land in Phase 2" style="gap:7px">
          <i class="ph ph-arrows-clockwise"></i>chezmoi diff
        </button>
      </div>
    </header>

    <div class="content">
      {{block "content" .}}{{end}}
    </div>
  </main>
</div>
</body>
</html>
{{end}}
